<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Szerelmes oldal</title>
<style>
/* ----- Alap stílusok ----- */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
    color: white;
    overflow-x: hidden;
}
.container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }

/* ----- Szív ----- */
.heart {
    width: 200px;
    height: 180px;
    background: red;
    position: relative;
    margin: 20px;
    transform: rotate(-45deg);
    animation: heartbeat 1.5s infinite;
}
.heart:before, .heart:after {
    content: "";
    width: 200px;
    height: 200px;
    background: red;
    border-radius: 50%;
    position: absolute;
}
.heart:before { top: -100px; left: 0; }
.heart:after { left: 100px; top: 0; }
@keyframes heartbeat {
    0%, 100% { transform: scale(1) rotate(-45deg); }
    50% { transform: scale(1.1) rotate(-45deg); }
}

/* ----- Login stílus ----- */
input, button {
    padding: 12px;
    font-size: 16px;
    margin: 10px;
    border-radius: 8px;
    border: none;
}
input { width: 200px; }
button {
    background: #ff4b5c;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover { background: #ff1f3d; }

/* ----- Main page ----- */
#mainPage { background: linear-gradient(to bottom, #2c3e50, #4ca1af); color: white; height: 100vh; justify-content: flex-start; padding-top: 50px; }
#timePassed { font-size: 32px; margin: 20px 0; }
#quote { font-size: 20px; font-style: italic; margin-bottom: 30px; max-width: 600px; }
#gallery { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
#gallery img { width: 120px; height: 120px; object-fit: cover; margin: 10px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.3s; }
#gallery img:hover { transform: scale(1.1); }

/* ----- Feltöltés gomb ----- */
#mainPage button { background: #ff6f61; }
#mainPage button:hover { background: #ff3b30; }

/* ----- Reszponzív ----- */
@media (max-width: 600px) {
    .heart { width: 150px; height: 135px; }
    .heart:before, .heart:after { width: 150px; height: 150px; }
    input { width: 150px; }
    #timePassed { font-size: 24px; }
    #quote { font-size: 16px; }
    #gallery img { width: 80px; height: 80px; }
}
</style>
</head>
<body>

<div id="login" class="container">
    <div class="heart"></div>
    <h2>Add meg a jelszót</h2>
    <input type="password" id="pw" placeholder="Jelszó" /><br>
    <button onclick="checkPassword()">Belépés</button>
</div>

<div id="mainPage" class="container">
    <div class="heart" style="transform: scale(1.8) rotate(-45deg);"></div>
    <h1 id="timePassed"></h1>
    <h2 id="quote"></h2>
    <div id="gallery"></div>
    <button onclick="uploadImage()">Kép feltöltése</button>
</div>

<script>
// ----- Jelszó hash ellenőrzés (SHA-256) -----
const correctHash = 'f77c0d290f1e91266d69a5ec6e40a1eae46a33c83f91d36e74c107b204eb00d8'; // 'szerelmem' SHA-256
async function checkPassword() {
    const pw = document.getElementById('pw').value;
    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    if(hashHex === correctHash) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('mainPage').style.display = 'flex';
        startTimer();
        loadQuote();
        loadGallery();
    } else {
        alert('Hibás jelszó!');
    }
}

document.getElementById('login').style.display = 'flex';

// ----- Idő számítása -----
function startTimer() {
    const startTime = new Date("2025-10-07T19:00:00");
    setInterval(() => {
        const now = new Date();
        const diff = now - startTime;
        const years = Math.floor(diff / (1000*60*60*24*365));
        const days = Math.floor(diff / (1000*60*60*24)) % 365;
        const hours = Math.floor(diff / (1000*60*60)) % 24;
        const mins = Math.floor(diff / (1000*60)) % 60;
        document.getElementById('timePassed').textContent = `${years} év, ${days} nap, ${hours} óra, ${mins} perc`;
    }, 1000);
}

// ----- Szerelmes idézet -----
const quotes = [
    "Szeretlek, mert te vagy a mindenem.",
    "Veled lett teljes az életem.",
    "A szívem csak érted dobog.",
    "Te vagy a legszebb történetem.",
    "Mindennap szeretlek egyre jobban.",
    "Te vagy az álmom valóra válva.",
    "Örökké melletted akarok lenni.",
    "A mosolyod fény az életemben.",
    "Te vagy a szívem otthona.",
    "Amíg élek, szeretni foglak."
];
function loadQuote() {
    const q = quotes[Math.floor(Math.random()*quotes.length)];
    document.getElementById('quote').textContent = q;
}

// ----- Google Drive galéria (nyilvános mappa) -----
const driveFolderLink = 'https://drive.google.com/drive/folders/1EIHv7Wkp62uvA9kIKzY1eOQh9ZL4GHYw?usp=sharing'; // ide tedd a nyilvános mappa linkjét
function loadGallery() {
    const gallery = document.getElementById('gallery');
    for(let i=1; i<=5; i++) {
        const img = document.createElement('img');
        img.src = `https://via.placeholder.com/120?text=Kép+${i}`;
        gallery.appendChild(img);
    }
}

// ----- Kép feltöltés (Google Drive API szükséges) -----
function uploadImage() {
    alert('A feltöltéshez Google Drive API kulcs szükséges.');
}
</script>

</body>
</html>
